# ---------------------------------------------------------------- 00 · HERO --
hero:
  eyebrow: "Associate Professor · INFI/UFMS"
  name: "Marcus Varanis"
  tagline: "Modeling complex systems beyond linearity and stationarity."
  body: |
    I am an associate professor at the Institute of Physics (INFI/UFMS) and lead the
    Nonlinear Dynamics and Signal Processing Group. My work combines analytical
    modeling, computational experiments, advanced signal analysis, and scientific
    machine learning to investigate nonlinear mechanical and biomedical systems.
  # The group name inside `body` is highlighted in gold automatically.
  highlight: "Nonlinear Dynamics and Signal Processing Group"
  cta_primary: { label: "Explore the research", href: "#research" }
  cta_secondary: { label: "Get in touch", href: "#contact" }
