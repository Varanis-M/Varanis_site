# ------------------------------------------------------------ 04 · PROJECTS --
projects:
  eyebrow: "04 — Active Projects"
  headline: "Living artifacts, not a list of papers."
  intro: "Each project below is a real, named, ongoing piece of work — with collaborators and a roadmap."
  items:
    - code: "CPR"
      title: "Nonlinear Chest Wall and Cardiopulmonary Modeling for CPR"
      href: "/projects/cpr-cardiopulmonary-modeling/"
      description: |
        A coupled computational model of nonlinear viscoelastic chest wall mechanics
        and cardiopulmonary circulation during CPR.
      meta:
        - { label: "Areas", value: "Biomedical modeling · Nonlinear dynamics" }
        - { label: "Collaborators", value: "Prof. C. Nataraj · Villanova Center for Analytics of Dynamic Systems (VCADS), Villanova University" }
    - code: "PQD"
      title: "Power Quality Disturbance Modeling and Classification"
      href: "/projects/power-quality-disturbance-classification/"
      description: |
        A signal processing and scientific machine learning framework for representing
        and classifying power quality disturbance signals.
      meta:
        - { label: "Areas", value: "Signal processing · Scientific machine learning" }
        - { label: "Methods", value: "IEEE 1159-2019 · Wavelet packet analysis · Entropy features · FT-Transformer" }
        - { label: "Team", value: "Nonlinear Dynamics and Signal Processing Group" }
    - code: "SciML"
      title: "Scientific Machine Learning for Nonlinear Systems"
      href: "/projects/scientific-machine-learning-nonlinear-systems/"
      description: |
        Hamiltonian and Lagrangian Neural Networks for the analysis of nonlinear
        dynamical systems and applications in materials science.
      meta:
        - { label: "Scope", value: "Research · Teaching" }
        - { label: "Methods", value: "Neural ODEs · HNNs and LNNs · PyTorch · Google Colab" }
        - { label: "Collaborators", value: "Prof. Américo Cunha Jr. (LNCC, Brazil) · Prof. J. M. Balthazar (UNESP, Brazil)" }
    - code: "NLD"
      title: "Nonlinear Dynamical Systems"
      href: "/projects/nonlinear-dynamical-systems/"
      description: |
        Analytical, computational, and experimental studies of nonlinear systems in
        mechanics and engineering, with emphasis on oscillations, stability,
        bifurcations, chaos, synchronization, vibro-impact, nonideal excitation,
        fractional-order effects, and energy harvesting.
      meta:
        - { label: "Areas", value: "Nonlinear dynamics · Mechanical vibrations · Applied mechanics" }
        - { label: "Collaborators", value: "J. M. Balthazar (UNESP, Brazil); Grzegorz Litak (Lublin University of Technology, Poland); Américo Cunha Jr. (LNCC, Brazil); Angelo Tusset (UTFPR, Brazil); Clivaldo Oliveira (UFGD, Brazil)" }

