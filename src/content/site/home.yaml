# --------------------------------------------------------------- 01 · ABOUT --
about:
  eyebrow: "01 — About"
  headline: "A physicist working at the intersection of theory, experiment, and computation."
  portrait_caption: "Group Leader"
  paragraphs:
    - |
      I am an associate professor at the Institute of Physics (INFI), Universidade
      Federal de Mato Grosso do Sul (UFMS), in Campo Grande, Brazil. I earned a D.Sc.
      in Mechanical Engineering from the School of Mechanical Engineering at
      Universidade Estadual de Campinas (UNICAMP) and completed postdoctoral research
      in the Department of Mechanical Engineering at UNESP Bauru.
    - |
      I am affiliated with the Graduate Program in Materials Science (PPGCM/INFI),
      where I teach undergraduate and graduate courses, advise undergraduate
      researchers and master's and doctoral students, and lead the Nonlinear Dynamics
      and Signal Processing Group.
    - |
      My research and teaching encompass nonlinear dynamics and vibrations,
      time-frequency analysis, fractional-order systems, scientific machine learning,
      and biomedical modeling. Within time-frequency analysis, my work includes
      wavelet packet methods, the Hilbert-Huang transform, synchrosqueezing, and
      synchroextracting transforms.
    - |
      I also maintain active collaborations with research groups in Brazil and abroad.

# ------------------------------------------------------------ 02 · RESEARCH --
research:
  eyebrow: "02 — Research"
  headline: "Five interlocking lines, one question."
  question: |
    How do real systems behave when linearity, stationarity, and isolation cease to
    be valid assumptions, and how can we measure, model, and predict that behavior?
  link: { label: "Explore the full research portfolio →", href: "#research" }
  lines:
    - tag: "P1"
      title: "Nonlinear Dynamics & Mechanical Vibrations"
      body: |
        Nonlinear oscillators, nonideal excitation and the Sommerfeld effect,
        vibro-impact dynamics, synchronization, fractional-order damping and memory
        effects, and mechanical energy harvesting.
    - tag: "P2"
      title: "Nonstationary Signal Processing"
      body: |
        Wavelet and wavelet packet analysis, synchrosqueezing and synchroextracting
        transforms, variational mode decomposition, and energy-entropy signatures for
        nonlinear and nonstationary signals.
    - tag: "P3"
      title: "Scientific Machine Learning"
      body: |
        Hamiltonian and Lagrangian Neural Networks, physics-informed learning, and
        multimodal deep learning for reconstructing and classifying dynamical regimes,
        including chaotic and hyperchaotic behavior.
    - tag: "P4"
      title: "Computational Biomedical Modeling"
      body: |
        Nonlinear models of chest wall mechanics and cardiopulmonary dynamics during
        CPR, nonlinear Windkessel hemodynamics, and coupled Van der Pol oscillators
        for cardiac rhythm modeling.
    - tag: "P5"
      title: "Teaching & Research Training"
      body: |
        Physically grounded computational frameworks and Feynman-inspired teaching
        materials for nonlinear dynamics, computational modeling, and simulation,
        supporting undergraduate research (Iniciação Científica) and master's and
        doctoral training.

